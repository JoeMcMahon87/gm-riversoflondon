<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="t">
  <title id="t">Remove from the tracker</title>
  <!--
    The same custodian, struck through: "stop tracking this token".

    The slash is drawn twice. The mask knocks a gap out of the helmet beneath it, then
    the white line is drawn into that gap, so the strike reads against the shape without
    needing to know what colour sits behind the icon. Painting the gap in a fixed
    background colour would only work on one theme.
  -->
  <defs>
    <mask id="strike">
      <rect width="24" height="24" fill="#ffffff"/>
      <path d="M3.6 20.4 20.4 3.6" stroke="#000000" stroke-width="4.4" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#strike)">
    <g fill="#ffffff">
      <circle cx="12" cy="3.5" r="1.25"/>
      <path d="M6.3 16.1C6.3 9.5 8.4 5.3 12 5.3s5.7 4.2 5.7 10.8Z"/>
      <rect x="4.2" y="16.1" width="15.6" height="2.7" rx="1.35"/>
    </g>
    <circle cx="12" cy="11.1" r="2" fill="#7FD1E8"/>
  </g>
  <path d="M3.6 20.4 20.4 3.6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
