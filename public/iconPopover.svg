<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="t">
  <title id="t">Open this token's sheet</title>
  <!--
    The context-menu entry that opens a token's sheet.

    Deliberately the same mark as ``icon.svg`` rather than a second design: both mean
    "this extension, this token", and a different drawing in the context menu would
    read as a different feature.
  -->
  <g fill="#ffffff">
    <circle cx="12" cy="3.5" r="1.25"/>
    <path d="M6.3 16.1C6.3 9.5 8.4 5.3 12 5.3s5.7 4.2 5.7 10.8Z"/>
    <rect x="4.2" y="16.1" width="15.6" height="2.7" rx="1.35"/>
  </g>
  <circle cx="12" cy="11.1" r="2" fill="#7FD1E8"/>
</svg>
