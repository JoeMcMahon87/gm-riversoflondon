<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="t">
  <title id="t">GM's Rivers of London</title>
  <!--
    A custodian helmet with a werelight where the badge sits: the Met and the Folly in
    one mark.

    White rather than themed on purpose. Owlbear Rodeo does not recolor extension
    icons, it renders the file as given, and its chrome is dark, so a dark silhouette
    would be invisible on the toolbar.

    Geometry is kept to circles, one curve and a rect so the mark stays legible at the
    16px the action button renders it at.
  -->
  <g fill="#ffffff">
    <circle cx="12" cy="3.5" r="1.25"/>
    <path d="M6.3 16.1C6.3 9.5 8.4 5.3 12 5.3s5.7 4.2 5.7 10.8Z"/>
    <rect x="4.2" y="16.1" width="15.6" height="2.7" rx="1.35"/>
  </g>
  <circle cx="12" cy="11.1" r="2" fill="#7FD1E8"/>
</svg>
